# PostgreSQL（このPCの中からだけ接続できる）
name: portfolio03-crm
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を書いてください}
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - crm-db:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  crm-db: